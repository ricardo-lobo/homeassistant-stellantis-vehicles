# Fork (ricardo-lobo): every Monday, merge the latest stable upstream release
# into `lobo`. When that conflicts with the fork's changes, push the release to
# a sync/<tag> branch and open a PR to resolve it by hand.
name: Sync with upstream releases

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lobo
          fetch-depth: 0
      - name: Merge the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/andreadegiovine/homeassistant-stellantis-vehicles.git
          git fetch --tags upstream
          tag=$(git tag --sort=-creatordate | grep -vi beta | head -1)
          if git merge-base --is-ancestor "$tag" HEAD; then
            echo "lobo already has $tag"
            exit 0
          fi
          if git merge --no-edit -m "chore: merge upstream $tag" "$tag"; then
            git push origin lobo
          else
            git merge --abort
            git checkout -b "sync/$tag" "$tag"
            git push -f origin "sync/$tag"
            gh pr create --base lobo --head "sync/$tag" --title "Sync upstream $tag (conflicts)" \
              --body "Merging upstream $tag into lobo conflicts with the fork's changes. Resolve here." || true
          fi
